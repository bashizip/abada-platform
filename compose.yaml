name: abada

services:
  postgres:
    image: postgres:15.13-alpine
    environment:
      POSTGRES_DB: abada_engine
      POSTGRES_USER: abada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abada_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abada -d abada_engine"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  abada-engine:
    image: ${ABADA_ENGINE_IMAGE:-ghcr.io/bashizip/abada-engine:1.0.0-rc.2}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "5601"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/abada_engine
      SPRING_DATASOURCE_USERNAME: abada
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-abada_dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      ABADA_SECURITY_MODE: oidc
      ABADA_TELEMETRY_ENABLED: "false"
      ABADA_TELEMETRY_OTLP_ENDPOINT: ${ABADA_TELEMETRY_OTLP_ENDPOINT:-}
      ABADA_ENVIRONMENT: ${ABADA_ENVIRONMENT:-development}
      OTEL_SDK_DISABLED: "true"
      ABADA_OUTBOX_DISPATCHER_ENABLED: "true"
      ABADA_INSIGHT_ENABLED: ${ABADA_INSIGHT_ENABLED:-false}
      ABADA_LLM_BASE_URL: ${ABADA_LLM_BASE_URL:-}
      ABADA_LLM_API_KEY: ${ABADA_LLM_API_KEY:-}
      ABADA_LLM_MODEL: ${ABADA_LLM_MODEL:-gemini-2.5-flash}
    volumes:
      - engine_logs:/app/logs
    networks:
      - edge
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5601/api/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  abada-tenda:
    image: ${ABADA_TENDA_IMAGE:-ghcr.io/bashizip/abada-tenda:1.0.0-rc.2}
    environment:
      ABADA_API_URL: ${ABADA_API_URL:-http://api.localhost/api}
      ABADA_OIDC_URL: ${ABADA_OIDC_URL:-http://keycloak.localhost}
      ABADA_OIDC_REALM: ${ABADA_OIDC_REALM:-abada-dev}
      ABADA_OIDC_CLIENT_ID: ${ABADA_OIDC_CLIENT_ID:-abada-frontend}
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5602/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  abada-orun:
    image: ${ABADA_ORUN_IMAGE:-ghcr.io/bashizip/abada-orun:1.0.0-rc.2}
    environment:
      ABADA_API_URL: ${ABADA_API_URL:-http://api.localhost/api}
      ABADA_OIDC_URL: ${ABADA_OIDC_URL:-http://keycloak.localhost}
      ABADA_OIDC_REALM: ${ABADA_OIDC_REALM:-abada-dev}
      ABADA_OIDC_CLIENT_ID: ${ABADA_OIDC_CLIENT_ID:-abada-frontend}
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5603/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  abada-studio:
    image: ${ABADA_STUDIO_IMAGE:-ghcr.io/bashizip/abada-studio:1.0.0-rc.2}
    environment:
      ABADA_API_URL: ${ABADA_API_URL:-http://api.localhost/api}
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5605/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  abada-agent-worker:
    profiles: ["agent"]
    image: ${ABADA_AGENT_WORKER_IMAGE:-ghcr.io/bashizip/abada-agent-worker:1.0.0-rc.2}
    environment:
      ABADA_ENGINE_URL: http://abada-engine:5601/api
      ABADA_ENGINE_TOKEN: ${ABADA_AGENT_ENGINE_TOKEN:-}
      ABADA_AGENT_OIDC_TOKEN_URL: ${ABADA_AGENT_OIDC_TOKEN_URL:-}
      ABADA_AGENT_OIDC_CLIENT_ID: ${ABADA_AGENT_OIDC_CLIENT_ID:-}
      ABADA_AGENT_OIDC_CLIENT_SECRET: ${ABADA_AGENT_OIDC_CLIENT_SECRET:-}
      # At least one LLM endpoint is required. Each gateway falls back to the
      # other, so the OpenAI-compatible endpoint is purely additive.
      ABADA_AGENT_LLM_BASE_URL: ${ABADA_AGENT_LLM_BASE_URL:-${ABADA_LLM_BASE_URL:-}}
      ABADA_AGENT_LLM_API_KEY: ${ABADA_AGENT_LLM_API_KEY:-${ABADA_LLM_API_KEY:-}}
      ABADA_AGENT_OPENAI_BASE_URL: ${ABADA_AGENT_OPENAI_BASE_URL:-${ABADA_AGENT_LLM_BASE_URL:-${ABADA_LLM_BASE_URL:-}}}
      ABADA_AGENT_OPENAI_API_KEY: ${ABADA_AGENT_OPENAI_API_KEY:-${ABADA_AGENT_LLM_API_KEY:-${ABADA_LLM_API_KEY:-}}}
      ABADA_AGENT_LLM_MODEL: ${ABADA_AGENT_LLM_MODEL:-${ABADA_LLM_MODEL:-gemini-2.5-flash}}
      ABADA_AGENT_ALLOWED_TOOLS: ${ABADA_AGENT_ALLOWED_TOOLS:-}
      ABADA_AGENT_PROJECT_ID: ${ABADA_AGENT_PROJECT_ID:-}
      ABADA_AGENT_POLL_INTERVAL_MS: ${ABADA_AGENT_POLL_INTERVAL_MS:-1000}
      ABADA_AGENT_MAX_TASKS: ${ABADA_AGENT_MAX_TASKS:-4}
      ABADA_AGENT_LOCK_DURATION_MS: ${ABADA_AGENT_LOCK_DURATION_MS:-120000}
    networks:
      - edge
    restart: unless-stopped
    # Liveness check: PID 1 is the worker JVM (java -jar agent-worker.jar).
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      abada-engine:
        condition: service_healthy

  abada-docs:
    image: ${ABADA_DOCS_IMAGE:-ghcr.io/bashizip/abada-docs:1.0.0-rc.2}
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5606/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  engine_logs:
