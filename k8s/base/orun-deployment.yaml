apiVersion: apps/v1
kind: Deployment
metadata:
  name: abada-orun
  namespace: abada
  labels:
    app.kubernetes.io/name: abada-orun
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: abada-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: abada-orun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abada-orun
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: abada-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: orun
          image: ghcr.io/bashizip/abada-orun:1.0.0-rc.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5603
              protocol: TCP
          envFrom:
            - configMapRef:
                name: abada-config
          env:
            - name: ABADA_API_URL
              valueFrom:
                secretKeyRef:
                  name: abada-secrets
                  key: ABADA_API_URL
                  optional: false
            - name: ABADA_OIDC_URL
              valueFrom:
                secretKeyRef:
                  name: abada-secrets
                  key: ABADA_OIDC_URL
                  optional: false
            - name: ABADA_OIDC_REALM
              valueFrom:
                secretKeyRef:
                  name: abada-secrets
                  key: ABADA_OIDC_REALM
                  optional: false
            - name: ABADA_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: abada-secrets
                  key: ABADA_OIDC_CLIENT_ID
                  optional: false
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
