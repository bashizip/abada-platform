apiVersion: v1
kind: Secret
metadata:
  name: abada-secrets
  namespace: abada
  labels:
    app.kubernetes.io/name: abada-secrets
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: abada-platform
type: Opaque
stringData:
  # PostgreSQL credentials (change before applying)
  POSTGRES_PASSWORD: "CHANGE_ME"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/abada_engine"

  # OIDC configuration (change before applying)
  OIDC_ISSUER_URI: ""
  OIDC_JWK_SET_URI: ""
  ABADA_ALLOWED_ORIGINS: ""

  # Telemetry (optional)
  ABADA_TELEMETRY_OTLP_ENDPOINT: ""
