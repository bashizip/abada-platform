# Abada login theme: Keycloak's stock login pages restyled to match Studio's
# canvas (warm charcoal surfaces, dot grid, amethyst primary action).
# Inherit every page template and PatternFly class mapping from the bundled
# `keycloak` theme; only the page shell (template.ftl) and styles change.
parent=keycloak
import=common/keycloak

# css/login.css resolves to the parent theme's stylesheet, so pages this theme
# does not restyle (OTP, WebAuthn, required actions) keep working; abada.css
# is loaded last and wins.
styles=css/login.css css/abada.css
