server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: abada-engine
    static_configs:
      - targets: [localhost]
        labels:
          job: abada-engine
          service_name: abada-engine
          __path__: /var/log/abada/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: traceId
            span_id: spanId
      - labels:
          level:
