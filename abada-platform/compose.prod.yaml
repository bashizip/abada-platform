services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
    restart: always

  abada-engine:
    image: ${ABADA_REGISTRY:-ghcr.io/bashizip}/abada-engine:${ABADA_VERSION:?Set ABADA_VERSION in the production environment file}
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
      ABADA_SECURITY_MODE: oidc
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Set OIDC_ISSUER_URI in the production environment file}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE in the production environment file}
      OIDC_JWK_SET_URI: ${OIDC_JWK_SET_URI:-}
      ABADA_ALLOWED_ORIGINS: ${ABADA_ALLOWED_ORIGINS:?Set ABADA_ALLOWED_ORIGINS in the production environment file}
      ABADA_TELEMETRY_ENABLED: ${ABADA_TELEMETRY_ENABLED:-false}
      ABADA_TELEMETRY_OTLP_ENDPOINT: ${ABADA_TELEMETRY_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.http.routers.engine-prod.rule: Host(`${ABADA_API_HOST:?Set ABADA_API_HOST}`)
      traefik.http.routers.engine-prod.entrypoints: websecure
      traefik.http.routers.engine-prod.tls: "true"
      traefik.http.routers.engine-prod.tls.certresolver: letsencrypt
      traefik.http.services.engine-prod.loadbalancer.server.port: "5601"

  abada-studio:
    image: ${ABADA_REGISTRY:-ghcr.io/bashizip}/abada-studio:${ABADA_VERSION:?Set ABADA_VERSION in the production environment file}
    environment:
      ABADA_API_URL: https://${ABADA_API_HOST:?Set ABADA_API_HOST}/api
      ABADA_OIDC_URL: ${ABADA_OIDC_URL:?Set ABADA_OIDC_URL for the frontend}
      ABADA_OIDC_REALM: ${ABADA_OIDC_REALM:?Set ABADA_OIDC_REALM for the frontend}
      ABADA_OIDC_CLIENT_ID: ${ABADA_OIDC_CLIENT_ID:?Set ABADA_OIDC_CLIENT_ID for the frontend}
      ABADA_CONFIG_PATH: /usr/share/nginx/html/config.js
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.studio-prod.rule: Host(`${ABADA_STUDIO_HOST:?Set ABADA_STUDIO_HOST}`)
      traefik.http.routers.studio-prod.entrypoints: websecure
      traefik.http.routers.studio-prod.tls: "true"
      traefik.http.routers.studio-prod.tls.certresolver: letsencrypt
      traefik.http.services.studio-prod.loadbalancer.server.port: "5605"

  abada-docs:
    image: ${ABADA_REGISTRY:-ghcr.io/bashizip}/abada-docs:${ABADA_VERSION:?Set ABADA_VERSION in the production environment file}
    restart: always
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs-prod.rule: Host(`${ABADA_DOCS_HOST:?Set ABADA_DOCS_HOST}`)
      traefik.http.routers.docs-prod.entrypoints: websecure
      traefik.http.routers.docs-prod.tls: "true"
      traefik.http.routers.docs-prod.tls.certresolver: letsencrypt
      traefik.http.services.docs-prod.loadbalancer.server.port: "5606"

  traefik:
    image: traefik:v3.6.2
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=abada_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ABADA_ACME_EMAIL:?Set ABADA_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - edge
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  letsencrypt_data:
