spring:
  application:
    name: abada-engine

  datasource:
      url: jdbc:h2:file:./data/abada-dev-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver
      username: sa
      password: ${DB_PASSWORD:abada123}
  jpa:
      hibernate:
        ddl-auto: validate
        show-sql: true
      database-platform: org.hibernate.dialect.H2Dialect
  flyway:
      enabled: true
      baseline-on-migrate: true
      baseline-version: 1
  h2:
      console:
        enabled: true
        path: /h2-console

# OpenTelemetry Development Configuration
management:
  tracing:
    sampling:
      probability: 1.0  # Always sample in development
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

otel:
  resource:
    attributes:
      deployment.environment: dev
  traces:
    sampler.arg: 1.0  # Always sample

logging:
  level:
    org.springframework.web: TRACE
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    com.zaxxer.hikari: DEBUG
    io.opentelemetry: DEBUG
    io.micrometer: DEBUG
    com.abada.engine: DEBUG

abada:
  scripts:
    # Development convenience: sandboxed script tasks are allowed. Production defaults to false.
    enabled: ${ABADA_SCRIPTS_ENABLED:true}
  telemetry:
    enabled: ${ABADA_TELEMETRY_ENABLED:false}
    otlp:
      endpoint: ${ABADA_TELEMETRY_OTLP_ENDPOINT:}
  security:
    mode: ${ABADA_SECURITY_MODE:proxy}
    allowed-origins: ${ABADA_ALLOWED_ORIGINS:http://localhost:5602,http://localhost:5603,http://tenda.localhost,http://orun.localhost}
