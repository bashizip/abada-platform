spring:
  application:
    name: abada-engine
    version: "@project.version@"
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:5601}
  servlet:
    context-path: /api

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# OpenTelemetry Configuration
otel:
  instrumentation:
    jdbc:
      enabled: false
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        "abada.process.duration": true
        "abada.task.waiting_time": true
        "abada.task.processing_time": true
  otlp:
    metrics:
      export:
        enabled: false

abada:
  telemetry:
    enabled: ${ABADA_TELEMETRY_ENABLED:false}
    environment: ${ABADA_ENVIRONMENT:${spring.profiles.active:default}}
    otlp:
      endpoint: ${ABADA_TELEMETRY_OTLP_ENDPOINT:}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
