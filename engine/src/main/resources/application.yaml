spring:
  application:
    name: abada-engine
    version: "@project.version@"
  profiles:
    active: dev
  jpa:
    # No EntityManager (and so no pooled connection) is held for a whole HTTP
    # request: each one is held only by the transaction that needs it. With
    # open-in-view, a 30-minute event stream kept its connection for its life
    # and a few watching clients exhausted the pool (see runtime-state.md).
    open-in-view: false

server:
  port: ${SERVER_PORT:5601}
  servlet:
    context-path: /api

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# OpenTelemetry Configuration
otel:
  instrumentation:
    jdbc:
      enabled: false
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,objectStore
  metrics:
    distribution:
      percentiles-histogram:
        "abada.process.duration": true
        "abada.task.waiting_time": true
        "abada.task.processing_time": true
  otlp:
    metrics:
      export:
        enabled: false

abada:
  # Code that runs inside workflow transactions. Expressions always use sandboxed CEL.
  scripts:
    enabled: ${ABADA_SCRIPTS_ENABLED:false}
  delegates:
    allowed-classes: ${ABADA_DELEGATES_ALLOWED_CLASSES:}
  telemetry:
    enabled: ${ABADA_TELEMETRY_ENABLED:false}
    environment: ${ABADA_ENVIRONMENT:${spring.profiles.active:default}}
    otlp:
      endpoint: ${ABADA_TELEMETRY_OTLP_ENDPOINT:}
  ai:
    # Each configured provider's own model list, read with its key once a day;
    # the models it lists are allowed for agent nodes beside agent.allowed-models.
    model-discovery:
      enabled: ${ABADA_MODEL_DISCOVERY_ENABLED:true}
    # Suggested prices from a public model catalog, read once a day (a GET with no
    # data from this installation); an administrator's price always wins. Off:
    # the snapshot shipped with the release prices what it knows.
    price-catalog:
      enabled: ${ABADA_PRICE_CATALOG_ENABLED:true}
      url: ${ABADA_PRICE_CATALOG_URL:https://openrouter.ai/api/v1/models}
  agent:
    allowed-models: ${ABADA_AGENT_ALLOWED_MODELS:gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash,deepseek/deepseek-v4-flash,gpt-5-mini}
  workers:
    first-party:
      - username: ${ABADA_FIRST_PARTY_AGENT_USERNAME:service-account-abada-agent-worker}
        topics:
          - ${ABADA_FIRST_PARTY_AGENT_TOPICS:abada:agent}
        models: ${ABADA_FIRST_PARTY_AGENT_MODELS:}
  # Process files (S9): bytes in RustFS through the S3 API, metadata in PostgreSQL.
  # RustFS is required for self-hosted installations; readiness fails while it
  # cannot be reached. Credentials come from the environment and are never logged.
  files:
    store: ${ABADA_FILES_STORE:s3}
    endpoint: ${ABADA_FILES_ENDPOINT:http://localhost:9000}
    region: ${ABADA_FILES_REGION:us-east-1}
    bucket: ${ABADA_FILES_BUCKET:abada-files}
    access-key: ${ABADA_FILES_ACCESS_KEY:}
    secret-key: ${ABADA_FILES_SECRET_KEY:}
    create-bucket: ${ABADA_FILES_CREATE_BUCKET:true}
    server-side-encryption: ${ABADA_FILES_SERVER_SIDE_ENCRYPTION:true}
    require-tls: ${ABADA_FILES_REQUIRE_TLS:false}
    max-file-bytes: ${ABADA_FILES_MAX_FILE_BYTES:10485760}
    max-task-bytes: ${ABADA_FILES_MAX_TASK_BYTES:52428800}
  identity:
    admin:
      url: ${ABADA_KEYCLOAK_URL:}
      realm: ${ABADA_KEYCLOAK_REALM:}
      client-id: ${ABADA_KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${ABADA_KEYCLOAK_ADMIN_CLIENT_SECRET:}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
