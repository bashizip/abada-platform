spring:
  application:
    name: abada-engine
    version: "@project.version@"
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:5601}
  servlet:
    context-path: /api

# Logging Configuration
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# OpenTelemetry Configuration
otel:
  instrumentation:
    jdbc:
      enabled: false
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        "abada.process.duration": true
        "abada.task.waiting_time": true
        "abada.task.processing_time": true
  otlp:
    metrics:
      export:
        enabled: false

abada:
  telemetry:
    enabled: ${ABADA_TELEMETRY_ENABLED:false}
    environment: ${ABADA_ENVIRONMENT:${spring.profiles.active:default}}
    otlp:
      endpoint: ${ABADA_TELEMETRY_OTLP_ENDPOINT:}
  agent:
    allowed-models: ${ABADA_AGENT_ALLOWED_MODELS:gemini-3.6-flash,deepseek/deepseek-v4-flash-free,gpt-5-mini}
  workers:
    first-party:
      - username: ${ABADA_FIRST_PARTY_AGENT_USERNAME:service-account-abada-agent-worker}
        topics:
          - ${ABADA_FIRST_PARTY_AGENT_TOPICS:abada:agent}
        models: ${ABADA_FIRST_PARTY_AGENT_MODELS:}
  identity:
    admin:
      url: ${ABADA_KEYCLOAK_URL:}
      realm: ${ABADA_KEYCLOAK_REALM:}
      client-id: ${ABADA_KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${ABADA_KEYCLOAK_ADMIN_CLIENT_SECRET:}

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
