version: abada.io/v1
metadata:
  name: Candidate Review
flow:
  entry: apply
  nodes:
    - id: apply
      type: webhook
      next: score
    - id: score
      type: decision-table
      decisionKey: CANDIDATE_SCORING
      hitPolicy: FIRST
      inputs:
        - name: score
      rules:
        - when: score >= 75
          then:
            rating: "pass"
        - otherwise: true
          then:
            rating: "fail"
      next: gate
    - id: gate
      type: human-input
      description: Approve the candidate
      assignees:
        - recruiters
      next: notify
    - id: notify
      type: agent
      confidence_threshold: 85
      max_attempts: 4
      next: end
    - id: end
      type: end