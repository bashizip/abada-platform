version: abada.io/v1
metadata:
  key: rework_loop
  name: Rework loop
flow:
  entry: request
  nodes:
    - id: request
      type: webhook
      next: draft
    # The step that repeats declares the bound of its loop.
    - id: draft
      type: engine-task
      description: Draft the offer
      service: rework-draft
      loop:
        max_iterations: 3
        on_exhausted: escalate
      next: review
    - id: review
      type: human-input
      description: Review the draft
      assignees: [reviewers]
      next: decide
    - id: decide
      type: condition
      rules:
        - if: "${approved == true}"
          then: done
        - else: draft
    - id: escalate
      type: human-input
      description: Manager decides after three rejected drafts
      assignees: [managers]
      next: done
    - id: done
      type: end
