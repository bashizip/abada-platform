version: abada.io/v1
metadata:
  key: boundaries
  name: Boundaries
flow:
  entry: request
  nodes:
    - id: request
      type: webhook
      next: draft
    # The agent may take one hour in total (retries and rate-limit waits
    # included); a rate-limited model falls back to the next one.
    - id: draft
      type: agent
      description: Draft the reply
      prompt: Draft a reply to the customer
      model: gemini-3.6-flash
      fallback_models: [gemini-3.7-flash]
      max_attempts: 2
      retry_backoff_ms: 0
      on_timeout:
        after: PT1H
        then: manual
      on_error: manual
      next: review
    # A reviewer has four hours before managers are added; after three days
    # the request expires.
    - id: review
      type: human-input
      description: Review the draft
      assignees: [reviewers]
      sla_hours: 4
      escalate_to: [managers]
      on_timeout:
        after: P3D
        then: expired
      next: done
    - id: manual
      type: human-input
      description: Write the reply by hand
      assignees: [operators]
      next: done
    - id: expired
      type: end
    - id: done
      type: end
