services:
  abada-engine:
    environment:
      ABADA_TELEMETRY_ENABLED: "true"
      ABADA_TELEMETRY_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SDK_DISABLED: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${ABADA_TRACING_SAMPLING_PROBABILITY:-0.1}
      OTEL_SERVICE_NAME: abada-engine
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=abada,deployment.environment=${ABADA_ENVIRONMENT:-development}
    networks:
      - telemetry

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployment/telemetry/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command:
      - sh
      - -ec
      - mkdir -p /badger/data /badger/key && chown -R 10001:10001 /badger
    volumes:
      - jaeger_data:/badger
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 16M

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger_data:/badger
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      jaeger-volume-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deployment/telemetry/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      otel-collector:
        condition: service_healthy

  loki:
    image: grafana/loki:2.9.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deployment/telemetry/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./deployment/telemetry/config.alloy:/etc/alloy/config.alloy:ro
      - engine_logs:/var/log/abada:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "alloy", "validate", "/etc/alloy/config.alloy"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:10.4.8
    environment:
      # Safe only for the local development command. Production preflight
      # requires an explicit non-placeholder value of at least 16 characters.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-abada_dev_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      - prometheus
      - jaeger
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  telemetry-health:
    image: curlimages/curl:8.11.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - telemetry
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
    depends_on:
      otel-collector:
        condition: service_started
      jaeger-volume-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      alloy:
        condition: service_started
      grafana:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://otel-collector:13133/ >/dev/null &&
          curl --fail --silent http://jaeger:16686/ >/dev/null &&
          curl --fail --silent http://prometheus:9090/-/ready >/dev/null &&
          curl --fail --silent http://loki:3100/ready >/dev/null &&
          curl --fail --silent http://alloy:12345/-/ready >/dev/null &&
          curl --fail --silent http://alloy:12345/-/healthy >/dev/null &&
          curl --fail --silent http://grafana:3000/api/health >/dev/null
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

networks:
  telemetry:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
  jaeger_data:
