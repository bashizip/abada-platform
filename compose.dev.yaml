services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abada_dev_password}

  abada-engine:
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-abada_dev_password}
      ABADA_SECURITY_MODE: oidc
      OIDC_ISSUER_URI: http://keycloak.localhost/realms/abada-dev
      OIDC_AUDIENCE: abada-frontend
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/abada-dev/protocol/openid-connect/certs
      ABADA_ALLOWED_ORIGINS: http://studio.localhost
      ABADA_TELEMETRY_ENABLED: ${ABADA_TELEMETRY_ENABLED:-false}
      ABADA_TELEMETRY_OTLP_ENDPOINT: ${ABADA_TELEMETRY_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
    depends_on:
      keycloak:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.engine-dev.rule: Host(`api.localhost`) || Host(`localhost`) || (Host(`studio.localhost`) && PathPrefix(`/api`))
      traefik.http.routers.engine-dev.entrypoints: web
      traefik.http.services.engine-dev.loadbalancer.server.port: "5601"

  abada-studio:
    environment:
      ABADA_API_URL: http://studio.localhost/api
      ABADA_OIDC_URL: http://keycloak.localhost
      ABADA_OIDC_REALM: abada-dev
      ABADA_OIDC_CLIENT_ID: abada-frontend
      ABADA_CONFIG_PATH: /usr/share/nginx/html/config.js
      ABADA_STARTER_WORKFLOW_ENABLED: ${ABADA_STARTER_WORKFLOW_ENABLED:-true}
    depends_on:
      keycloak:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.studio-dev.rule: Host(`studio.localhost`)
      traefik.http.routers.studio-dev.entrypoints: web
      traefik.http.services.studio-dev.loadbalancer.server.port: "5605"

  abada-docs:
    labels:
      traefik.enable: "true"
      traefik.http.routers.docs-dev.rule: Host(`docs.localhost`)
      traefik.http.routers.docs-dev.entrypoints: web
      traefik.http.services.docs-dev.loadbalancer.server.port: "5606"

  keycloak-db:
    image: postgres:15.13-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-abada_dev_keycloak}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-abada_dev_keycloak}
      KC_HOSTNAME: keycloak.localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./docker/keycloak/import/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
    networks:
      - edge
      - data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak-dev.rule: Host(`keycloak.localhost`)
      traefik.http.routers.keycloak-dev.entrypoints: web
      traefik.http.services.keycloak-dev.loadbalancer.server.port: "8080"

  traefik:
    image: traefik:v3.6.2
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-abada}_edge
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      edge:
        aliases:
          - keycloak.localhost
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  keycloak_data:
