name: Build and publish Abada platform images

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: abada-engine
            context: engine
            dockerfile: engine/Dockerfile.prod.engine
          - image: abada-tenda
            context: tenda
            dockerfile: tenda/Dockerfile.prod
          - image: abada-orun
            context: orun
            dockerfile: orun/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable and channel tags
        id: tags
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          tags="$repository:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags="$tags,$repository:${GITHUB_REF_NAME#v}"
          else
            tags="$tags,$repository:${GITHUB_REF_NAME//\//-}"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image platforms
        shell: bash
        run: ./scripts/test/verify-image-platforms.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:sha-$GITHUB_SHA"

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained checksummed platform archive
        shell: bash
        run: ./release/build-bundle.sh "${GITHUB_REF_NAME#v}"
      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes=("docs/release-notes/$version-release-notes.md")
            if [[ -f "${notes[0]}" ]]; then
              notes=(--notes-file "${notes[0]}")
            else
              notes=(--generate-notes)
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Abada $version" "${notes[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "release/dist/abada-platform-$version.tar.gz" \
            "release/dist/abada-platform-$version.tar.gz.sha256" \
            --clobber
