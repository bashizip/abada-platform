name: Build and publish Abada platform images

# dev: build the images locally on the runner to prove they build; nothing is
# tagged or pushed. main (after a promotion PR merges) and v* release tags:
# build and publish to GHCR.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.ref != 'refs/heads/dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: abada-engine
            context: .
            dockerfile: engine/Dockerfile.prod.engine
          - image: abada-studio
            context: .
            dockerfile: studio/Dockerfile.prod
          - image: abada-docs
            context: .
            dockerfile: documentation/Dockerfile.prod
          - image: abada-agent-worker
            context: .
            dockerfile: agent-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable and channel tags
        if: env.PUBLISH == 'true'
        id: tags
        shell: bash
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          tags="$repository:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tags="$tags,$repository:${GITHUB_REF_NAME#v}"
          else
            tags="$tags,$repository:${GITHUB_REF_NAME//\//-}"
          fi
          echo "value=$tags" >> "$GITHUB_OUTPUT"
      - name: Build image locally (dev, not tagged or pushed)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image platforms
        if: env.PUBLISH == 'true'
        shell: bash
        run: ./scripts/test/verify-image-platforms.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}:sha-$GITHUB_SHA"

  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    uses: ./.github/workflows/publish-release-bundle.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
      promote: true
    secrets:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
