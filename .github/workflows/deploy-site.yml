name: Deploy website

# Builds abada-site/packages/web and deploys it to the Cloudflare Pages
# project behind abadaplatform.com whenever main changes the site.
on:
  push:
    branches: [main]
    paths:
      - "abada-site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://abadaplatform.com
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: abada-site
        run: bun install --frozen-lockfile

      # Runs the claims check and the type check before building.
      - name: Build
        working-directory: abada-site/packages/web
        run: bun run build

      # The project's production branch in Cloudflare Pages is named "dev";
      # deploying under that name updates abadaplatform.com. Wrangler runs
      # through bunx: npm cannot install into this Bun workspace.
      - name: Deploy to Cloudflare Pages
        working-directory: abada-site/packages/web
        env:
          # Dedicated token with only Cloudflare Pages edit permission.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: >-
          bunx wrangler@4.127.0 pages deploy dist --project-name abada-website
          --branch dev --commit-hash "${{ github.sha }}" --commit-dirty=false
